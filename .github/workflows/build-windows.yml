name: Windows build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write   # reliz yaratish uchun
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # teglar kerak: versiya relizi bor-yo'qligini tekshirish uchun
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Testlar
        run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Versiya
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import mor as s; print(s.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Reliz kerakmi
        id: rel
        shell: bash
        env:
          FORCED: ${{ startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]') }}
          VER: ${{ steps.ver.outputs.version }}
        # main ga yangi versiya kelsa (v<versiya> tegi hali yo'q) — reliz avtomatik; aks holda faqat [release] yoki v* teg
        run: |
          if [ "$FORCED" = "true" ]; then echo "do=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ] && ! git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then echo "do=true" >> "$GITHUB_OUTPUT"
          else echo "do=false" >> "$GITHUB_OUTPUT"; fi
      - name: Ilova kodi arxivi (yangilanadigan qism)
        shell: pwsh
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: python tools/release.py app --notes "$env:NOTES"
      - name: .exe yig'ish
        run: pyinstaller --noconfirm build.spec
      - name: Yig'ilgan .exe ni sinash (--self-test)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          MYOWNROBOT_UPDATES_DIR: ${{ runner.temp }}\no_updates
        run: |
          try {
            $out = Join-Path $env:RUNNER_TEMP 'selftest.json'
            $p = Start-Process -FilePath 'dist\MyOwnRobot\MyOwnRobot.exe' -ArgumentList '--self-test', $out -PassThru
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "self-test osilib qoldi (120 s)" }
            if ((Test-Path "$out.err") -and (Get-Item "$out.err").Length -gt 0) { $e = (Get-Content "$out.err" -Raw); throw ("self-test xatosi: " + $e.Substring([Math]::Max(0, $e.Length - 1200))) }
            if ($p.ExitCode -ne 0) { throw "self-test chiqish kodi: $($p.ExitCode)" }
            $j = Get-Content $out | ConvertFrom-Json
            Write-Host "Versiya: $($j.version)  Manba: $($j.source)"
            if ($j.version -ne '${{ steps.ver.outputs.version }}') { throw "Versiya mos emas" }
            if ($j.source -notlike '*app\myownrobot_app.zip') { throw "Kod zip'dan yuklanmadi" }
          } catch { Write-Host ("::error::" + (($_ | Out-String) -replace "`r?`n"," | ")); exit 1 }
      - name: Robot .exe ichidan ishlashini sinash (--robot import + train)
        shell: pwsh
        env:
          MYOWNROBOT_UPDATES_DIR: ${{ runner.temp }}\no_updates
          MYOWNROBOT_HOME: ${{ runner.temp }}\mor_home
        run: |
          $exe = 'dist\MyOwnRobot\MyOwnRobot.exe'
          $csv = (Resolve-Path 'dist\MyOwnRobot\_internal\data\XAUUSD_M15.csv').Path
          $p = Start-Process -FilePath $exe -ArgumentList '--robot','import',$csv,'--symbol','XAUUSD','--tf','M15' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "import chiqish kodi: $($p.ExitCode)" }
          $p = Start-Process -FilePath $exe -ArgumentList '--robot','train','--epochs','1','--envs','4','--symbols','XAUUSD','--max-seconds','60' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "train chiqish kodi: $($p.ExitCode)" }
      - name: Arxivlash va yangilanish fayllari
        shell: pwsh
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          Compress-Archive -Path dist/MyOwnRobot -DestinationPath MyOwnRobot_Windows.zip
          python tools/release.py publish release --full MyOwnRobot_Windows.zip --notes "$env:NOTES"
      - uses: actions/upload-artifact@v4
        with:
          name: MyOwnRobot_Windows
          path: release/*
      - name: Reliz (main'da yangi versiya, v* teg yoki [release] commit)
        # O'rnatilgan dasturlar releases/latest/download/update.json orqali yangilanishni topadi.
        if: github.event_name == 'push' && steps.rel.outputs.do == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: MyOwnRobot ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          body: |
            Windows uchun tayyor desktop ilova.

            **Birinchi o'rnatish:** `MyOwnRobot_Windows.zip` ni yuklab oling, arxivni oching va
            `MyOwnRobot\MyOwnRobot.exe` ni ishga tushiring. Jonli savdo uchun MetaTrader 5 terminali (DEMO hisob) kerak.

            **Yangilash:** o'rnatilgan dastur o'zi yangilanadi (Sozlamalar → Yangilanish). `update.json` va
            `myownrobot_app-*.zip` — yangilanish fayllari; tarmoq papkasidan yangilash uchun shu uch faylni papkaga ko'chiring.
