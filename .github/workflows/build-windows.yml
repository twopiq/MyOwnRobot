name: Windows build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write   # v* teglarida GitHub Release yaratish uchun
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Testlar
        run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen
      - name: .exe yig'ish
        run: pyinstaller --noconfirm build.spec
      - name: Yig'ilgan .exe ni sinash (--self-test)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'selftest.json'
          $p = Start-Process -FilePath 'dist\MyOwnRobot\MyOwnRobot.exe' -ArgumentList '--self-test', $out -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test chiqish kodi: $($p.ExitCode)" }
          Get-Content $out
      - name: Robot .exe ichidan ishlashini sinash (--robot --learn)
        shell: pwsh
        run: |
          $st = Join-Path $env:RUNNER_TEMP 'st'
          $p = Start-Process -FilePath 'dist\MyOwnRobot\MyOwnRobot.exe' -ArgumentList '--robot','--learn','--mode','ml','--history','_internal\data\XAUUSD_M15.csv','--state',$st -Wait -PassThru -WorkingDirectory 'dist\MyOwnRobot'
          if ($p.ExitCode -ne 0) { throw "robot chiqish kodi: $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $st 'report_ml.json'))) { throw "hisobot yozilmadi" }
      - name: Arxivlash
        shell: pwsh
        run: Compress-Archive -Path dist/MyOwnRobot -DestinationPath MyOwnRobot_Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MyOwnRobot_Windows
          path: MyOwnRobot_Windows.zip
      - name: Reliz (v* teg)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MyOwnRobot_Windows.zip
          body: |
            Windows uchun tayyor desktop ilova. `MyOwnRobot_Windows.zip` ni oching va `MyOwnRobot\MyOwnRobot.exe` ni ishga tushiring.
            Jonli savdo uchun MetaTrader 5 terminali (DEMO hisob) kerak.
